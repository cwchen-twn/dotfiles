---
# kubectl/helm/kubectx/terraform come from mise. Here: things needing system integration.
- name: Docker (Debian/Ubuntu)
  when: is_debian and 'docker' in devops
  vars:
    docker_url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}"
    # Docker publishes a release only once it is out, so Debian testing (#57) uses the newest stable one's packages.
    docker_fallback_suite: "{{ 'trixie' if ansible_distribution == 'Debian' else 'noble' }}"
  block:
    - name: Docker publishes this release?
      ansible.builtin.uri:
        url: "{{ docker_url }}/dists/{{ ansible_distribution_release }}/Release"
        method: HEAD
        status_code: [200, 404]
      register: docker_dist
      until: docker_dist is succeeded
      retries: 3
      delay: 5
      check_mode: false # read-only probe
    - name: Docker repo
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: "{{ docker_url }}"
        suites: "{{ ansible_distribution_release if docker_dist.status == 200 else docker_fallback_suite }}"
        components: stable
        architectures: "{{ arch_deb }}"
        signed_by: "{{ docker_url }}/gpg"
      # key servers time out now and then, and the module re-fetches the key on every run
      register: repo_key
      until: repo_key is succeeded
      retries: 3
      delay: 10
    - name: Docker packages
      ansible.builtin.apt:
        update_cache: true
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    - name: User in docker group
      ansible.builtin.user: { name: "{{ user }}", groups: docker, append: true }
    # On demand: docker.socket starts the daemon on the first `docker` command (~140 MB saved while unused).
    # Containers with a restart policy therefore don't come up at boot.
    - name: Docker not started at boot
      ansible.builtin.systemd_service: { name: "{{ item }}", enabled: false }
      loop: [docker.service, containerd.service]
    - name: Docker socket activation
      ansible.builtin.systemd_service: { name: docker.socket, enabled: true, state: started }

- name: Tailscale (Debian/Ubuntu)
  when: is_debian and 'tailscale' in devops
  block:
    - name: Tailscale repo
      ansible.builtin.deb822_repository:
        name: tailscale
        types: deb
        uris: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}"
        suites: "{{ ansible_distribution_release }}"
        components: main
        signed_by: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.noarmor.gpg"
      # key servers time out now and then, and the module re-fetches the key on every run
      register: repo_key
      until: repo_key is succeeded
      retries: 3
      delay: 10
    - name: Tailscale package
      ansible.builtin.apt: { name: tailscale, update_cache: true }

- name: MacOS casks
  when: is_mac
  community.general.homebrew_cask:
    name: "{{ (['docker'] if 'docker' in devops else []) + (['tailscale'] if 'tailscale' in devops else []) }}"
