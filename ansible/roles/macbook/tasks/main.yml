# Apple MacBook hardware on Debian/Ubuntu (auto-detected from DMI, see setup.yml):
# Broadcom Wi-Fi firmware, fan control, power management, Fn keys, touchpad, keyboard backlight and the FaceTime HD camera.
- name: MacBook packages
  ansible.builtin.apt:
    name:
      - mbpfan
      - brightnessctl     # screen/keyboard brightness keys (lxqt role) and kbd-backlight-idle
      - tlp
      - dkms
      - "{{ 'linux-headers-amd64' if ansible_distribution == 'Debian' else 'linux-headers-generic' }}"
      - cpio
      - xz-utils
      - curl
      - git
      - xprintidle      # kbd-backlight-idle
      - intel-gpu-tools # sudo intel_gpu_top (Iris 6100)
    update_cache: true

- name: Broadcom Wi-Fi firmware (Ubuntu ships it in linux-firmware)
  ansible.builtin.apt: { name: firmware-brcm80211 }
  when: ansible_distribution == 'Debian'

# Quieter than Debian's defaults (63/66/86 spins up on any compile). The CPU throttles at ~105 C, so this is safe.
# Live tweaks: edit /etc/mbpfan.conf + `sudo systemctl restart mbpfan`; watch with `watch cat /sys/devices/platform/applesmc.768/fan1_input`.
- name: Fan curve (mbpfan)
  ansible.builtin.lineinfile:
    path: /etc/mbpfan.conf
    regexp: '^\s*{{ item.key }}\s*='
    line: "{{ item.key }} = {{ item.value }}"
    insertafter: '^\[general\]'
  loop: "{{ mbpfan_conf | dict2items }}"
  vars:
    mbpfan_conf: { low_temp: 68, high_temp: 76, max_temp: 90 }
  notify: Restart mbpfan

# Turbo only on AC: on battery the dual-core stays cooler, the fan quieter and the battery lasts noticeably longer.
# Everything else is TLP's defaults (runtime PM, USB/SATA autosuspend, Wi-Fi power save).
- name: TLP settings
  ansible.builtin.copy:
    dest: /etc/tlp.d/50-dotfiles.conf
    mode: "0644"
    content: |
      # Managed by ansible (macbook role)
      CPU_BOOST_ON_AC=1
      CPU_BOOST_ON_BAT=0
  notify: Restart tlp

- name: Fan control and power management
  ansible.builtin.systemd_service: { name: "{{ item }}", enabled: true, state: started }
  loop: [mbpfan, tlp]

# BD PROCHOT: the SMC can assert the CPU's external "processor hot" line, which pins every core at 500 MHz with no
# thermal throttle event logged. Seen on a MacBookPro12,1 on battery under load (Brave) at 68-76 C. Clearing bit 0 of
# MSR 0x1FC makes the CPU ignore that line; its own thermal protection (TjMax ~105 C) still applies. The bit comes
# back on reboot and after resume, so the unit runs at boot and after every sleep. Check: `sudo rdmsr -a 0x1FC` is even.
- name: Ignore the SMC's BD PROCHOT
  block:
    - name: Msr-tools (rdmsr, wrmsr)
      ansible.builtin.apt: { name: msr-tools }

    - name: Clear script and its unit
      ansible.builtin.copy:
        dest: "{{ item.dest }}"
        mode: "{{ item.mode }}"
        content: "{{ item.content }}"
      loop:
        - dest: /usr/local/sbin/clear-bd-prochot
          mode: "0755"
          content: |
            #!/bin/sh
            # Managed by the dotfiles (ansible macbook role). Clears BD PROCHOT (MSR 0x1FC bit 0) on every CPU.
            set -eu
            modprobe msr
            for d in /dev/cpu/[0-9]*; do
                c=${d##*/}
                v=$(rdmsr -p "$c" -u 0x1FC)
                [ $((v & 1)) -eq 1 ] || continue
                wrmsr -p "$c" 0x1FC $((v & ~1))
                logger -t clear-bd-prochot "cleared BD PROCHOT on CPU $c"
            done
        - dest: /etc/systemd/system/clear-bd-prochot.service
          mode: "0644"
          content: |
            # Managed by the dotfiles (ansible macbook role)
            [Unit]
            Description=Ignore the SMC's BD PROCHOT (CPU stuck at 500 MHz)
            After=suspend.target hibernate.target hybrid-sleep.target suspend-then-hibernate.target

            [Service]
            Type=oneshot
            ExecStart=/usr/local/sbin/clear-bd-prochot

            [Install]
            WantedBy=multi-user.target suspend.target hibernate.target hybrid-sleep.target suspend-then-hibernate.target
      loop_control: { label: "{{ item.dest }}" }
      register: prochot_unit

    - name: Enable it and clear the bit now
      ansible.builtin.systemd_service:
        name: clear-bd-prochot.service
        enabled: true
        state: started
        daemon_reload: "{{ prochot_unit.changed }}"

- name: F1-F12 act as function keys (hold Fn for media keys)
  ansible.builtin.copy:
    dest: /etc/modprobe.d/hid_apple.conf
    content: "options hid_apple fnmode=2\n"
    mode: "0644"
  notify: Update initramfs

# Mac-like touchpad for every X session (login screen included). Overrides the libinput defaults from
# /usr/share/X11/xorg.conf.d/40-libinput.conf; needs an X restart (log out/in). LXQt's touchpad settings
# override these if you change them there. Gestures: libinput-gestures (desktop role).
- name: Xorg.conf.d directory
  ansible.builtin.file: { path: /etc/X11/xorg.conf.d, state: directory, mode: "0755" }

- name: Touchpad behaves like macOS (tap, natural scrolling, two-finger right-click)
  ansible.builtin.copy:
    dest: /etc/X11/xorg.conf.d/50-macbook-touchpad.conf
    mode: "0644"
    content: |
      Section "InputClass"
          Identifier "MacBook touchpad"
          MatchIsTouchpad "on"
          MatchDriver "libinput"
          Option "Tapping" "on"
          Option "TappingDrag" "on"
          Option "NaturalScrolling" "true"
          Option "ClickMethod" "clickfinger"
          Option "DisableWhileTyping" "true"
          Option "ScrollMethod" "twofinger"
      EndSection

# macOS-style three-finger drag. Xorg's libinput driver (1.5.0) can't enable it, so linux-3-finger-drag grabs the
# touchpad, turns 3-finger drags into a held left button on a virtual mouse and mirrors everything else to a clone
# touchpad (which the xorg.conf.d settings above still apply to). Consequence: 3-finger swipes no longer exist,
# so workspace gestures use 4 fingers (as on macOS with three-finger drag on). Started by the systemd user unit
# ~/.config/systemd/user/three-finger-drag.service (chezmoi); tuning: ~/.config/linux-3-finger-drag/3fd-config.json.
# https://github.com/lmr97/linux-3-finger-drag
- name: Three-finger drag
  vars:
    tfd_version: v1.7.0
    cargo: "{{ home }}/.cargo/bin/cargo"
  block:
    - name: Build dependencies and uinput access (input group)
      ansible.builtin.apt: { name: [pkg-config, libinput-dev, libudev-dev] }

    - name: Uinput writable by the input group
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/60-uinput.rules
        content: |
          KERNEL=="uinput", GROUP="input", MODE="0660", TAG+="uaccess"
        mode: "0644"
      register: uinput_rule

    - name: Load uinput at boot
      ansible.builtin.copy: { dest: /etc/modules-load.d/uinput.conf, content: "uinput\n", mode: "0644" }

    - name: Load uinput now and apply the rule  # noqa: no-handler  inline on purpose
      ansible.builtin.shell: modprobe uinput && udevadm control --reload && udevadm trigger --sysname-match=uinput
      when: uinput_rule.changed
      changed_when: true

    - name: Installed version  # noqa: risky-shell-pipe  grep -q early exit would SIGPIPE cargo under pipefail
      become: false
      ansible.builtin.shell: "{{ cargo }} install --list 2>/dev/null | grep -q '^linux-3-finger-drag {{ tfd_version }}:'"
      register: tfd_installed
      changed_when: false
      failed_when: false

    - name: Build linux-3-finger-drag into ~/.cargo/bin (needs the rust runtime)
      become: false
      ansible.builtin.command: >-
        {{ cargo }} install --locked --git https://github.com/lmr97/linux-3-finger-drag --tag {{ tfd_version }}
      changed_when: true
      when: tfd_installed.rc != 0 and (cargo is file)

# FaceTime HD camera: firmware extracted from Apple's update package + out-of-tree driver built with DKMS
# (rebuilt automatically on kernel upgrades). https://github.com/patjak/facetimehd
- name: FaceTime HD firmware source  # noqa: latest[git]  tracks upstream HEAD on purpose
  ansible.builtin.git:
    repo: https://github.com/patjak/facetimehd-firmware.git
    dest: /usr/local/src/facetimehd-firmware
    depth: 1
    update: false

- name: Extract and install FaceTime HD firmware
  ansible.builtin.shell: make && make install
  args:
    chdir: /usr/local/src/facetimehd-firmware
    creates: /lib/firmware/facetimehd/firmware.bin

- name: FaceTime HD driver source  # noqa: latest[git]  tracks upstream HEAD on purpose
  ansible.builtin.git:
    repo: https://github.com/patjak/facetimehd.git
    dest: /usr/local/src/facetimehd
    depth: 1
  register: facetimehd_src

- name: Read driver version
  ansible.builtin.slurp: { src: /usr/local/src/facetimehd/dkms.conf }
  register: facetimehd_conf

- name: Set driver version
  ansible.builtin.set_fact:
    facetimehd_ver: "{{ facetimehd_conf.content | b64decode | regex_search('PACKAGE_VERSION=\"?([^\"\\n]+)', '\\1') | first }}"

- name: Copy driver into the DKMS tree
  ansible.builtin.copy:
    src: /usr/local/src/facetimehd/
    dest: "/usr/src/facetimehd-{{ facetimehd_ver }}/"
    remote_src: true
    mode: preserve

- name: Build and install the driver for every kernel with headers  # noqa: risky-shell-pipe  grep -q early exit would SIGPIPE dkms under pipefail
  ansible.builtin.shell: |
    set -e
    m=facetimehd v={{ facetimehd_ver }}
    {% if facetimehd_src.changed %}dkms remove -m $m -v $v --all >/dev/null 2>&1 || true{% endif %}
    dkms status -m $m -v $v | grep -q . || dkms add -m $m -v $v
    for k in /lib/modules/*; do
      k=${k##*/}
      [ -e "/lib/modules/$k/build" ] || continue
      dkms status -m $m -v $v -k "$k" | grep -q installed && continue
      dkms install -m $m -v $v -k "$k"
      echo CHANGED
    done
  args: { executable: /bin/bash }
  register: facetimehd_dkms
  changed_when: "'CHANGED' in facetimehd_dkms.stdout"

- name: Load facetimehd at boot, blacklist the conflicting bdc_pci
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    content: "{{ item.content }}"
    mode: "0644"
  loop:
    - { dest: /etc/modules-load.d/facetimehd.conf, content: "facetimehd\n" }
    - { dest: /etc/modprobe.d/facetimehd.conf, content: "blacklist bdc_pci\n" }

- name: Load facetimehd now (fails harmlessly if the running kernel is older than the headers; works after reboot)
  ansible.builtin.command: modprobe facetimehd
  changed_when: false
  failed_when: false

# Browsers: facetimehd reports its frame sizes as a range (V4L2 "stepwise"), which Chromium's camera code skips, so
# Brave/Chrome see no camera (PipeWire doesn't help: it passes the same range on). Fix: a v4l2loopback camera
# /dev/video10 "FaceTime HD (relay)" with fixed 1280x720, fed by ffmpeg while `camera-on` runs (systemd user unit
# camera-relay); pick it in Meet etc., `camera-off` afterwards.
- name: Virtual camera relay (v4l2loopback via DKMS)
  ansible.builtin.apt: { name: [v4l2loopback-dkms, ffmpeg] }

- name: V4l2loopback device for the relay
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    content: "{{ item.content }}"
    mode: "0644"
  loop:
    - { dest: /etc/modules-load.d/v4l2loopback.conf, content: "v4l2loopback\n" }
    - dest: /etc/modprobe.d/v4l2loopback.conf
      content: |
        # exclusive_caps: browsers only accept it as a camera while something feeds it (camera-on)
        options v4l2loopback video_nr=10 card_label="FaceTime HD (relay)" exclusive_caps=1
  register: v4l2loopback_conf

- name: Load v4l2loopback now  # noqa: no-handler  inline on purpose
  ansible.builtin.shell: modprobe -r v4l2loopback 2>/dev/null; modprobe v4l2loopback
  when: v4l2loopback_conf.changed
  changed_when: true
  failed_when: false

# Earlier attempt (PipeWire camera for browsers) didn't work for this camera: remove it, but only where PipeWire was
# installed for video alone. Where it is the audio system (pipewire-pulse, e.g. Ubuntu) it stays.
- name: Is PipeWire the audio system here?
  ansible.builtin.stat: { path: /usr/bin/pipewire-pulse }
  register: pipewire_pulse

- name: Remove the PipeWire camera attempt
  ansible.builtin.apt: { name: [pipewire, wireplumber], state: absent }
  when: not pipewire_pulse.stat.exists

# Hibernation: resume from a swap partition >= RAM, or create a RAM + 2 GB /swapfile. Same script as the standalone one.
- name: Hibernation (swap + resume device)
  ansible.builtin.script: "{{ playbook_dir }}/../install/debian/hibernate.sh"
  register: hibernate
  changed_when: "'CHANGED' in hibernate.stdout"

# The Broadcom Wi-Fi driver (brcmfmac) doesn't survive the chip losing power, so the hook unloads it before every sleep
# and loads it again after (Wi-Fi reconnects ~5 s after wake-up, like at boot). Seen on a MacBookPro12,1 (Debian 13,
# kernel 6.12):
#   - hibernation: resume hangs (black screen, sometimes a reset) right after the image is loaded. Bisected:
#     intel_iommu=off and nokaslr didn't help, unloading facetimehd alone didn't, unloading brcmfmac alone did.
#   - suspend (S3): the card stays unavailable for ~50 s after wake-up and NetworkManager then never reconnects.
# Before unloading, the hook pins the card and its PCIe bridge in D0 (power/control=on). On battery TLP sets them to
# runtime PM "auto", so the card, once unbound, drops to D3cold, and after any sleep the firmware never powers it back:
# "Unable to change power state from D3cold to D0, device inaccessible", no Wi-Fi until a reboot.
- name: Sleep hook (Wi-Fi driver out during any sleep)
  ansible.builtin.copy:
    dest: /usr/lib/systemd/system-sleep/50-dotfiles-macbook
    mode: "0755"
    content: |
      #!/bin/sh
      # Managed by the dotfiles (ansible macbook role). $1: pre|post, $2: the sleep verb;
      # SYSTEMD_SLEEP_ACTION: the phase of suspend-then-hibernate (suspend, hibernate, ...).
      modules="brcmfmac_wcc brcmfmac"   # brcmfmac_wcc uses brcmfmac: unload it first
      state=/run/dotfiles-sleep-modules
      case "$1/${SYSTEMD_SLEEP_ACTION:-$2}" in
          pre/*)
              : > "$state"
              # Keep the card and its bridge powered while unbound (no D3cold); TLP re-applies its setting after resume.
              for d in /sys/bus/pci/drivers/brcmfmac/0000:*; do
                  [ -e "$d" ] || continue
                  d=$(readlink -f "$d")
                  echo on > "$d/power/control"
                  echo on > "$(dirname "$d")/power/control"
              done
              for m in $modules; do
                  grep -q "^$m " /proc/modules || continue
                  echo "$m" >> "$state"
                  modprobe -r "$m" || logger -t sleep-hook "could not unload $m: resume may hang"
              done ;;
          post/*)
              [ -f "$state" ] || exit 0
              for m in $(cat "$state"); do modprobe "$m"; done
              rm -f "$state" ;;
      esac

# The touchpad comes back as a new input device after any sleep; linux-3-finger-drag keeps reading the old one
# (no error, so Restart=on-failure never fires). Restart it once user sessions are thawed: a unit ordered after
# the sleep targets runs after resume (the system-sleep hook above runs while user sessions are still frozen).
# yamllint disable rule:line-length
- name: Restart three-finger drag after sleep
  ansible.builtin.copy:
    dest: /etc/systemd/system/dotfiles-after-sleep.service
    mode: "0644"
    content: |
      # Managed by the dotfiles (ansible macbook role)
      [Unit]
      Description=Restart per-user input helpers after sleep (dotfiles)
      After=suspend.target hibernate.target hybrid-sleep.target suspend-then-hibernate.target

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c 'for u in $$(loginctl list-users --no-legend | cut -d" " -f2); do systemctl --machine="$$u@.host" --user try-restart three-finger-drag.service || true; done'

      [Install]
      WantedBy=suspend.target hibernate.target hybrid-sleep.target suspend-then-hibernate.target
  register: after_sleep
# yamllint enable rule:line-length

- name: Enable it
  ansible.builtin.systemd_service: { name: dotfiles-after-sleep.service, enabled: true, daemon_reload: "{{ after_sleep.changed }}" }

# Lid closed: suspend, then hibernate after 2 h asleep (or earlier if the battery runs low) on battery; plain
# suspend on AC. Wake from suspend takes ~1 s, from hibernation ~30 s but costs no battery. logind applies this
# only if LXQt's power manager leaves the lid alone (lxqt-powermanagement.conf below); takes effect after a reboot.
- name: Drop-in directories (not shipped by Debian)
  ansible.builtin.file: { path: "{{ item }}", state: directory, mode: "0755" }
  loop: [/etc/systemd/logind.conf.d, /etc/systemd/sleep.conf.d]

- name: Lid and sleep policy
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - dest: /etc/systemd/logind.conf.d/50-dotfiles-lid.conf
      content: |
        # Managed by the dotfiles (ansible macbook role)
        [Login]
        HandleLidSwitch=suspend-then-hibernate
        HandleLidSwitchExternalPower=suspend
        HandleLidSwitchDocked=ignore
    - dest: /etc/systemd/sleep.conf.d/50-dotfiles.conf
      content: |
        # Managed by the dotfiles (ansible macbook role)
        [Sleep]
        HibernateDelaySec=2h
        # Power off (S5) after writing the image instead of entering ACPI S4: in S4 the armed wake sources
        # (Wi-Fi, USB, PCIe ports) powered the MacBook straight back on. Resume from the image is unchanged.
        HibernateMode=shutdown
  loop_control: { label: "{{ item.dest }}" }

# LXQt's power manager otherwise holds the lid switch itself (only suspend/hibernate, no suspend-then-hibernate).
# Battery low (5%): hibernate instead of the default. Actions: 1 hibernate, 3 shut down, 4 suspend.
- name: LXQt power manager hands the lid to logind
  become: false
  community.general.ini_file:
    path: "{{ home }}/.config/lxqt/lxqt-powermanagement.conf"
    section: General
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0644"
  loop: "{{ {'enableLidWatcher': 'false', 'enableBatteryWatcher': 'true', 'powerLowAction': 1, 'powerLowLevel': 5} | dict2items }}"
  when: desktop | length > 0

# Retina screen (`hidpi`, see setup.yml): readable GRUB, console and login screen. The desktop session itself is the
# lxqt role (Xft.dpi in ~/.Xresources).
- name: HiDPI boot and login
  when: hidpi | bool
  block:
    - name: GRUB font at 36 px (the default unicode.pf2 is 16 px on a 2560x1600 framebuffer)
      ansible.builtin.command: >-
        grub-mkfont -s 36 -o /boot/grub/fonts/dejavu-mono-36.pf2 /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
      args: { creates: /boot/grub/fonts/dejavu-mono-36.pf2 }
      notify: Update grub

    # Console/terminal font; the menu theme (and its fonts) comes from the boottheme role.
    - name: GRUB uses it
      ansible.builtin.copy:
        dest: /etc/default/grub.d/hidpi.cfg
        mode: "0644"
        content: |
          GRUB_FONT=/boot/grub/fonts/dejavu-mono-36.pf2
          GRUB_GFXPAYLOAD_LINUX=keep
      notify: Update grub

    - name: Console (TTY and boot messages) in Terminus 16x32
      ansible.builtin.lineinfile:
        path: /etc/default/console-setup
        regexp: '^{{ item.key }}='
        line: '{{ item.key }}="{{ item.value }}"'
      loop: "{{ {'FONTFACE': 'Terminus', 'FONTSIZE': '16x32'} | dict2items }}"
      notify: Update initramfs

    # SDDM's greeter is Qt6 and scales from Xft.dpi like the session; its theme comes from the boottheme role.
    - name: SDDM config dir
      ansible.builtin.file: { path: /etc/sddm.conf.d, state: directory, mode: "0755" }

    - name: SDDM greeter at 2x
      ansible.builtin.copy:
        dest: /etc/sddm.conf.d/10-hidpi.conf
        mode: "0644"
        content: |
          [X11]
          EnableHiDPI=true
          DisplayCommand=/etc/sddm/Xsetup-hidpi

    - name: SDDM display setup script (stock Xsetup + Xft.dpi for the greeter)
      ansible.builtin.copy:
        dest: /etc/sddm/Xsetup-hidpi
        mode: "0755"
        content: |
          #!/bin/sh
          # Managed by ansible (macbook role). Runs as root before the SDDM greeter appears.
          /usr/share/sddm/scripts/Xsetup
          printf 'Xft.dpi: 192\nXcursor.size: 48\n' | xrdb -merge
