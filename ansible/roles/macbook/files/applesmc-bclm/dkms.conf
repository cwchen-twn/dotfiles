# Managed by the dotfiles (ansible macbook role). The kernel's own applesmc driver plus a charge_limit file (SMC key
# BCLM). prepare.sh takes applesmc.c from Debian's linux-source for the kernel being built and patches it; when that
# fails (no matching source, the patch no longer applies) the build fails and the in-tree applesmc stays in use.
PACKAGE_NAME="applesmc-bclm"
PACKAGE_VERSION="1"
PRE_BUILD="prepare.sh $kernelver"
CLEAN="rm -f applesmc.c *.o *.ko *.mod *.mod.c .*.cmd modules.order Module.symvers"
BUILT_MODULE_NAME[0]="applesmc"
DEST_MODULE_LOCATION[0]="/updates"
AUTOINSTALL="yes"
