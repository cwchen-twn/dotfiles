---
- name: OpenVPN 2.x
  when: is_debian and 'openvpn' in extras
  block:
    # Profiles come from chezmoi (encrypted) into /etc/openvpn/client/<name>.conf; run as openvpn-client@<name>.
    # update-systemd-resolved: the up/down script that hands pushed DNS to systemd-resolved.
    - name: Openvpn
      ansible.builtin.apt: { name: [openvpn, openvpn-systemd-resolved, systemd-resolved] }
      register: ovpn_pkgs
    # Debian doesn't ship systemd-resolved by default; installing it switches /etc/resolv.conf to the 127.0.0.53 stub
    # at once. Until dbus loads resolve1's policy and NetworkManager (started before resolved existed) hands it the
    # uplink DNS, resolved has no upstream servers and name resolution is dead until a reboot.
    - name: Bring up systemd-resolved after first install  # noqa: no-handler  block runs only on first install
      when: ovpn_pkgs is changed
      block:
        - name: Reload dbus (resolve1 policy)
          ansible.builtin.systemd_service: { name: dbus, state: reloaded }
        - name: Restart systemd-resolved
          ansible.builtin.systemd_service: { name: systemd-resolved, state: restarted, enabled: true }
        - name: NetworkManager present?
          ansible.builtin.stat: { path: /usr/sbin/NetworkManager }
          register: nm_bin
        - name: Restart NetworkManager (feeds DNS to resolved)
          ansible.builtin.systemd_service: { name: NetworkManager, state: restarted }
          when: nm_bin.stat.exists
    # resolved only gets VPN DNS (update-systemd-resolved) if it owns /etc/resolv.conf. Tailscale, started before
    # resolved existed, writes the file directly and so bypasses it; after the stub is back it registers MagicDNS
    # with resolved instead (a per-link routing domain) once tailscaled restarts.
    - name: /etc/resolv.conf is the systemd-resolved stub
      ansible.builtin.file: { src: /run/systemd/resolve/stub-resolv.conf, dest: /etc/resolv.conf, state: link, force: true }
      register: resolv_link
    - name: Tailscaled present?
      ansible.builtin.stat: { path: /usr/sbin/tailscaled }
      register: tailscaled_bin
    - name: Restart tailscaled (DNS through resolved)
      ansible.builtin.systemd_service: { name: tailscaled, state: restarted }
      when: resolv_link is changed and tailscaled_bin.stat.exists
    # OpenVPN 3 (the earlier client) and its repo: replaced by OpenVPN 2.x above.
    - name: Purge OpenVPN 3
      ansible.builtin.apt: { name: [openvpn3, openvpn3-client], state: absent, purge: true }
    - name: OpenVPN 3 repo, key and state gone
      ansible.builtin.file: { path: "{{ item }}", state: absent }
      loop:
        - /etc/apt/sources.list.d/openvpn3.sources
        - /etc/apt/sources.list.d/openvpn3.list
        - /etc/apt/keyrings/openvpn3.asc
        - /var/lib/openvpn3
    # Legacy umbrella unit for /etc/openvpn/*.conf; unused (template units only), nothing to start at boot.
    - name: Openvpn.service off at boot
      ansible.builtin.systemd_service: { name: openvpn.service, enabled: false }

- name: Openfortivpn
  ansible.builtin.apt: { name: openfortivpn }
  when: is_debian and 'openfortivpn' in extras

- name: NordVPN
  when: is_debian and 'nordvpn' in extras
  block:
    - name: NordVPN repo
      ansible.builtin.deb822_repository:
        name: nordvpn
        types: deb
        uris: https://repo.nordvpn.com/deb/nordvpn/debian
        suites: stable
        components: main
        signed_by: https://repo.nordvpn.com/gpg/nordvpn_public.asc
      # key servers time out now and then, and the module re-fetches the key on every run
      register: repo_key
      until: repo_key is succeeded
      retries: 3
      delay: 10
    - name: Nordvpn
      ansible.builtin.apt: { name: nordvpn, update_cache: true }
    - name: User in nordvpn group
      ansible.builtin.user: { name: "{{ user }}", groups: nordvpn, append: true }
    # Off until needed (~100 MB): its socket unit has BindsTo=nordvpnd.service, so even the socket starts the daemon
    # at boot. `nordvpnstart` / `nordvpnstop` (fish) start and stop both; then `nordvpn connect` as usual.
    - name: Nordvpnd off at boot (service and socket)
      ansible.builtin.systemd_service: { name: "{{ item }}", enabled: false }
      loop: [nordvpnd.socket, nordvpnd.service]

- name: VPN clients (macOS)
  when: is_mac
  community.general.homebrew_cask:
    name: "{{ (['tunnelblick'] if 'openvpn' in extras else []) + (['nordvpn'] if 'nordvpn' in extras else []) }}"
