# One look from power-on to desktop: GRUB menu, Plymouth boot splash and SDDM login, all from an sddm-astronaut
# preset (https://github.com/Keyitdev/sddm-astronaut-theme, GPL-3.0). The login screen uses the theme as-is; the GRUB
# and Plymouth themes are generated here from the preset's wallpaper and palette.
# Switch presets: set boottheme_preset (Themes/<name>.conf upstream) and its colors below, then `chezmoi apply`.
# Generated images/fonts are only created once per theme dir: after changing colors or sizes, delete
# /boot/grub/themes/astronaut-<preset> and /usr/share/plymouth/themes/astronaut-<preset> to regenerate.
boottheme_preset: black_hole
boottheme_commit: abb3163c724935af888ba5ea9ac0c4f22afd8048   # 2026-09-18
boottheme_src: /usr/local/src/sddm-astronaut-theme
boottheme_name: "astronaut-{{ boottheme_preset }}"

# Palette (from Themes/black_hole.conf)
boottheme_accent: "#5c729d"
boottheme_text: "#b7cef1"
boottheme_panel: "#22162f"
boottheme_dark: "#171426"

# Screen size and font sizes (`hidpi` comes from setup.yml: Retina MacBooks)
boottheme_res: "{{ '2560x1600' if hidpi | default(false) | bool else '1920x1080' }}"
boottheme_font_item: "{{ 36 if hidpi | default(false) | bool else 20 }}"
boottheme_font_small: "{{ 24 if hidpi | default(false) | bool else 16 }}"
