# GRUB menu -> Plymouth splash -> SDDM login (-> desktop wallpaper, lxqt role) in one look; see defaults/main.yml.
- name: Packages (SDDM theme runtime, image/font tools, Plymouth)
  ansible.builtin.apt:
    name:
      - qml6-module-qtquick-controls
      - qml6-module-qtquick-layouts
      - qml6-module-qtquick-effects
      - qml6-module-qtquick-virtualkeyboard
      - qml6-module-qtmultimedia
      - qt6-svg-plugins
      - libxcb-cursor0
      - imagemagick
      - rsync
      - plymouth
      - plymouth-themes
      - fonts-jetbrains-mono   # GRUB theme font, regenerated at the scaled sizes

- name: sddm-astronaut source (pinned)
  ansible.builtin.git:
    repo: https://github.com/Keyitdev/sddm-astronaut-theme.git
    dest: "{{ boottheme_src }}"
    version: "{{ boottheme_commit }}"
    depth: 1
    force: true

- name: Preset wallpaper exists
  ansible.builtin.stat: { path: "{{ boottheme_src }}/Backgrounds/{{ boottheme_preset }}.png" }
  register: boottheme_wallpaper
  failed_when: not boottheme_wallpaper.stat.exists

# ---------------------------------------------------------------- images (one per screen)
- name: Backgrounds dir
  ansible.builtin.file: { path: "{{ boottheme_bg_dir }}/src", state: directory, mode: "0755" }

- name: Download the images (pinned, checksummed)
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ boottheme_bg_dir }}/src/{{ item.name }}{{ item.url | splitext | last }}"
    checksum: "sha256:{{ item.sha256 }}"
    mode: "0644"
  loop: "{{ boottheme_images.values() | unique }}"
  loop_control: { label: "{{ item.name }}" }

# Cropped to the screen once: the originals are up to 34 megapixels, which every login would otherwise decode.
- name: Crop the images to the screen
  ansible.builtin.command: >-
    magick {{ boottheme_bg_dir }}/src/{{ item.name }}{{ item.url | splitext | last }} -resize {{ boottheme_res }}^
    -gravity center -extent {{ boottheme_res }} -quality 92 {{ boottheme_bg_dir }}/{{ item.name }}-{{ boottheme_res }}.jpg
  args: { creates: "{{ boottheme_bg_dir }}/{{ item.name }}-{{ boottheme_res }}.jpg" }
  loop: "{{ boottheme_images.values() | unique }}"
  loop_control: { label: "{{ item.name }}" }

# Image per screen; a screen without an entry in boottheme_images uses the preset's wallpaper. The lxqt role reads
# boottheme_bg.wallpaper.
- name: Image per screen
  ansible.builtin.set_fact:
    boottheme_bg: >-
      {%- set out = {} -%}
      {%- for screen in ['splash', 'login', 'wallpaper'] -%}
        {%- if screen in boottheme_images -%}
          {%- set _ = out.update({screen: boottheme_bg_dir ~ '/' ~ boottheme_images[screen].name ~ '-' ~ boottheme_res ~ '.jpg'}) -%}
        {%- else -%}
          {%- set _ = out.update({screen: boottheme_wallpaper.stat.path}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}

# ---------------------------------------------------------------- login (SDDM)
- name: SDDM theme files
  ansible.builtin.command: >-
    rsync -a --delete --itemize-changes --exclude .git --exclude Themes/astronaut.conf.user --exclude 'Backgrounds/dotfiles-*'
    {{ boottheme_src }}/ /usr/share/sddm/themes/sddm-astronaut-theme/
  register: boottheme_rsync
  changed_when: boottheme_rsync.stdout | length > 0

- name: Theme fonts
  ansible.builtin.command: >-
    rsync -a --itemize-changes {{ boottheme_src }}/Fonts/ /usr/share/fonts/sddm-astronaut/
  register: boottheme_fonts
  changed_when: boottheme_fonts.stdout | length > 0

- name: Font cache
  ansible.builtin.command: fc-cache -f /usr/share/fonts/sddm-astronaut
  when: boottheme_fonts.changed

- name: Login background
  ansible.builtin.copy:
    src: "{{ boottheme_bg.login }}"
    dest: /usr/share/sddm/themes/sddm-astronaut-theme/Backgrounds/dotfiles-login.jpg
    remote_src: true
    mode: "0644"

- name: Read the preset
  ansible.builtin.slurp: { src: "{{ boottheme_src }}/Themes/{{ boottheme_preset }}.conf" }
  register: boottheme_preset_conf

# SDDM loads <ConfigFile>.user on top of metadata.desktop's ConfigFile (Themes/astronaut.conf), so upstream files stay
# untouched: the preset's layout, with our background and palette swapped in key by key.
- name: Login config (preset layout, our image and palette)
  ansible.builtin.copy:
    dest: /usr/share/sddm/themes/sddm-astronaut-theme/Themes/astronaut.conf.user
    mode: "0644"
    content: >-
      {%- set ns = namespace(conf=boottheme_preset_conf.content | b64decode) -%}
      {%- for key, value in boottheme_login_keys.items() -%}
        {%- set ns.conf = ns.conf | regex_replace('(?m)^' ~ key ~ '=.*$', key ~ '="' ~ value ~ '"') -%}
      {%- endfor -%}
      {{ ns.conf }}
  vars:
    boottheme_login_keys:
      Background: Backgrounds/dotfiles-login.jpg
      BackgroundColor: "{{ boottheme_dark }}"
      DimBackgroundColor: "{{ boottheme_dark }}"
      HeaderTextColor: "{{ boottheme_accent }}"
      DateTextColor: "{{ boottheme_accent }}"
      TimeTextColor: "{{ boottheme_text }}"
      FormBackgroundColor: "{{ boottheme_dark }}"
      LoginFieldBackgroundColor: "{{ boottheme_field }}"
      PasswordFieldBackgroundColor: "{{ boottheme_field }}"
      LoginFieldTextColor: "{{ boottheme_text }}"
      PasswordFieldTextColor: "{{ boottheme_text }}"
      UserIconColor: "{{ boottheme_text }}"
      PasswordIconColor: "{{ boottheme_text }}"
      PlaceholderTextColor: "{{ boottheme_subtext }}"
      WarningColor: "{{ boottheme_warning }}"
      LoginButtonTextColor: "{{ boottheme_dark }}"
      LoginButtonBackgroundColor: "{{ boottheme_accent }}"
      SystemButtonsIconsColor: "{{ boottheme_text }}"
      SessionButtonTextColor: "{{ boottheme_text }}"
      VirtualKeyboardButtonTextColor: "{{ boottheme_text }}"
      DropdownTextColor: "{{ boottheme_text }}"
      DropdownSelectedBackgroundColor: "{{ boottheme_field }}"
      DropdownBackgroundColor: "{{ boottheme_dark }}"
      HighlightTextColor: "{{ boottheme_dark }}"
      HighlightBackgroundColor: "{{ boottheme_accent }}"
      HighlightBorderColor: "{{ boottheme_accent }}"
      HoverUserIconColor: "{{ boottheme_accent }}"
      HoverPasswordIconColor: "{{ boottheme_accent }}"
      HoverSystemButtonsIconsColor: "{{ boottheme_accent }}"
      HoverSessionButtonTextColor: "{{ boottheme_accent }}"
      HoverVirtualKeyboardButtonTextColor: "{{ boottheme_accent }}"

- name: SDDM uses the theme
  ansible.builtin.copy:
    dest: /etc/sddm.conf.d/20-theme.conf
    mode: "0644"
    content: |
      [Theme]
      Current=sddm-astronaut-theme

# ---------------------------------------------------------------- GRUB (AstronautGrub, scaled)
- name: GRUB theme source (pinned)
  ansible.builtin.git:
    repo: "{{ boottheme_grub_repo }}"
    dest: "{{ boottheme_grub_src }}"
    version: "{{ boottheme_grub_commit }}"
    depth: 1
    force: true

- name: GRUB theme dir
  ansible.builtin.file: { path: "{{ boottheme_grub_dir }}", state: directory, mode: "0755" }

# Everything but theme.txt and the fonts, which are rebuilt for the screen below.
- name: GRUB theme files
  ansible.builtin.command: >-
    rsync -a --delete --itemize-changes --exclude theme.txt --exclude '*.pf2'
    {{ boottheme_grub_src }}/{{ boottheme_grub_variant }}/ {{ boottheme_grub_dir }}/
  register: boottheme_grub_rsync
  changed_when: boottheme_grub_rsync.stdout | length > 0
  notify: boottheme update grub

- name: GRUB theme.txt, scaled for the screen
  ansible.builtin.script:
    cmd: >-
      scale-grub-theme.py {{ boottheme_grub_src }}/{{ boottheme_grub_variant }}/theme.txt
      {{ boottheme_grub_dir }}/theme.txt {{ boottheme_grub_scale }}
    executable: python3
  register: boottheme_grub_txt
  changed_when: "'CHANGED' in boottheme_grub_txt.stderr"
  notify: boottheme update grub

# The script prints the font sizes the scaled theme names ("JetBrains Mono Regular <size>").
- name: GRUB fonts at the scaled sizes
  ansible.builtin.command: >-
    grub-mkfont -s {{ item }} -o {{ boottheme_grub_dir }}/JetBrainsMono-{{ item }}.pf2
    /usr/share/fonts/truetype/jetbrains-mono/JetBrainsMono-Regular.ttf
  args: { creates: "{{ boottheme_grub_dir }}/JetBrainsMono-{{ item }}.pf2" }
  loop: "{{ boottheme_grub_txt.stdout_lines }}"
  notify: boottheme update grub

- name: grub drop-in directory
  ansible.builtin.file: { path: /etc/default/grub.d, state: directory, mode: "0755" }

- name: GRUB uses the theme
  ansible.builtin.copy:
    dest: /etc/default/grub.d/theme.cfg
    mode: "0644"
    content: |
      GRUB_THEME={{ boottheme_grub_dir }}/theme.txt
  notify: boottheme update grub

# ---------------------------------------------------------------- Plymouth (boot splash)
- name: Plymouth theme dir
  ansible.builtin.file: { path: "/usr/share/plymouth/themes/{{ boottheme_name }}", state: directory, mode: "0755" }

- name: Plymouth images (wallpaper, progress bar and track)
  ansible.builtin.command: "{{ item.cmd }}"
  args: { creates: "/usr/share/plymouth/themes/{{ boottheme_name }}/{{ item.file }}" }
  loop:
    - file: background.png
      cmd: >-
        magick {{ boottheme_bg.splash }} -resize {{ boottheme_res }}^ -gravity center -extent {{ boottheme_res }}
        /usr/share/plymouth/themes/{{ boottheme_name }}/background.png
    - file: bar.png
      cmd: magick -size 8x8 xc:"{{ boottheme_text }}" /usr/share/plymouth/themes/{{ boottheme_name }}/bar.png
    - file: track.png
      cmd: magick -size 8x8 xc:"{{ boottheme_accent }}66" /usr/share/plymouth/themes/{{ boottheme_name }}/track.png
  loop_control: { label: "{{ item.file }}" }
  notify: boottheme update initramfs

- name: Plymouth script
  ansible.builtin.template:
    src: astronaut.script.j2
    dest: "/usr/share/plymouth/themes/{{ boottheme_name }}/astronaut.script"
    mode: "0644"
  notify: boottheme update initramfs

- name: Plymouth theme definition
  ansible.builtin.copy:
    dest: "/usr/share/plymouth/themes/{{ boottheme_name }}/{{ boottheme_name }}.plymouth"
    mode: "0644"
    content: |
      [Plymouth Theme]
      Name={{ boottheme_name }}
      Description=The splash image with a progress bar (dotfiles boottheme role)
      ModuleName=script

      [script]
      ImageDir=/usr/share/plymouth/themes/{{ boottheme_name }}
      ScriptFile=/usr/share/plymouth/themes/{{ boottheme_name }}/astronaut.script
  notify: boottheme update initramfs

- name: Plymouth default theme
  ansible.builtin.shell: |
    [ "$(plymouth-set-default-theme)" = "{{ boottheme_name }}" ] && exit 0
    plymouth-set-default-theme {{ boottheme_name }} && echo CHANGED
  register: boottheme_plymouth
  changed_when: "'CHANGED' in boottheme_plymouth.stdout"
  notify: boottheme update initramfs

- name: Plymouth at 2x on Retina screens
  community.general.ini_file:
    path: /etc/plymouth/plymouthd.conf
    section: Daemon
    option: DeviceScale
    value: "2"
    no_extra_spaces: true
    mode: "0644"
  when: hidpi | default(false) | bool
  notify: boottheme update initramfs

- name: Show the splash at boot (kernel command line)
  ansible.builtin.copy:
    dest: /etc/default/grub.d/splash.cfg
    mode: "0644"
    content: |
      GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT splash"
  notify: boottheme update grub

# ---------------------------------------------------------------- cleanup
# update-grub / update-initramfs first, so nothing still points at a theme that is about to go.
- name: Apply the new themes before removing old ones
  ansible.builtin.meta: flush_handlers

# Themes generated by earlier versions of this role (astronaut-<preset>, look-<image>), now unused.
- name: Find old generated themes
  ansible.builtin.find:
    paths: [/boot/grub/themes, /usr/share/plymouth/themes]
    file_type: directory
    patterns: ["astronaut-*", "look-*"]
  register: boottheme_old

- name: Remove old generated themes
  ansible.builtin.file: { path: "{{ item }}", state: absent }
  loop: >-
    {{ boottheme_old.files | map(attribute='path')
       | reject('equalto', '/usr/share/plymouth/themes/' ~ boottheme_name) | list }}
