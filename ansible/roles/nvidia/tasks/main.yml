---
- name: Ubuntu-drivers
  ansible.builtin.apt: { name: ubuntu-drivers-common }
  when: ansible_distribution == 'Ubuntu'

- name: Install recommended NVIDIA driver
  ansible.builtin.command: ubuntu-drivers install
  register: drv
  changed_when: "'All the available drivers are already installed' not in drv.stdout"
  when: ansible_distribution == 'Ubuntu'

- name: CUDA keyring
  ansible.builtin.apt:
    deb: "https://developer.download.nvidia.com/compute/cuda/repos/{{ ansible_distribution | lower }}{{ ansible_distribution_version | replace('.', '') }}\
      /x86_64/cuda-keyring_1.1-1_all.deb"
  when: ansible_architecture == 'x86_64'

- name: CUDA toolkit
  ansible.builtin.apt: { name: cuda-toolkit, update_cache: true }
