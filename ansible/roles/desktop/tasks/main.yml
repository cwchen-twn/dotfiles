---
- name: Desktop apps (Debian/Ubuntu)
  when: is_debian
  block:
    - name: Brave repo
      ansible.builtin.deb822_repository:
        name: brave-browser-release
        types: deb
        uris: https://brave-browser-apt-release.s3.brave.com/
        suites: stable
        components: main
        architectures: "{{ arch_deb }}"
        signed_by: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
      # key servers time out now and then, and the module re-fetches the key on every run
      register: repo_key
      until: repo_key is succeeded
      retries: 3
      delay: 10
      when: "'brave' in desktop"

    - name: VS Code repo
      ansible.builtin.deb822_repository:
        name: vscode
        types: deb
        uris: https://packages.microsoft.com/repos/code
        suites: stable
        components: main
        architectures: "{{ arch_deb }}"
        signed_by: https://packages.microsoft.com/keys/microsoft.asc
      # key servers time out now and then, and the module re-fetches the key on every run
      register: repo_key
      until: repo_key is succeeded
      retries: 3
      delay: 10
      when: "'vscode' in desktop"

    - name: Apt desktop packages
      ansible.builtin.apt:
        update_cache: true
        name: "{{ query('ansible.builtin.dict', apt_map) | selectattr('key', 'in', desktop) | map(attribute='value') | flatten }}"
      vars:
        apt_map:
          brave: [brave-browser, vainfo]   # vainfo: which codecs the GPU decodes (media-check)
          vscode: [code]
          kitty: [kitty]
          libinput-gestures: [libinput-tools]
          # libreoffice-qt6: LXQt 2.x themes only Qt6 apps, so LO's Qt5 backend stays light (lxqt role picks qt6)
          libreoffice: [libreoffice, libreoffice-qt6]
          calibre: [calibre]
          fcitx5: [fcitx5, fcitx5-chewing, fcitx5-chinese-addons, fonts-noto-cjk]  # input methods: ~/.config/fcitx5/profile
          supersonic: [libmpv2, playerctl]  # the player itself comes from mise; playerctl drives the media keys

    # Bluetooth audio (pair with the blueman tray or bluetoothctl) and driverless printing/scanning anywhere: fish
    # `printers` lists the IPP/AirPrint printers on the network, `printer-add N` adds one (lpadmin group, no sudo).
    # PipeWire when pipewire-pulse is installed (Debian 14 desktops; PulseAudio may stay installed but inactive),
    # else PulseAudio (Debian 13 LXQt). Each needs its own Bluetooth audio module.
    - name: Audio server is PipeWire?
      ansible.builtin.stat: { path: /usr/bin/pipewire-pulse }
      register: pipewire_pulse
    - name: Bluetooth, printing and scanning
      ansible.builtin.apt:
        name:
          - bluez
          - blueman
          - "{{ 'libspa-0.2-bluetooth' if pipewire_pulse.stat.exists else 'pulseaudio-module-bluetooth' }}"
          - cups
          - avahi-daemon   # mDNS: finds printers/scanners, resolves *.local
          - avahi-utils
          - libnss-mdns
          - sane-airscan   # eSCL/WSD scanners, no vendor driver
          - sane-utils
          - ipp-usb        # USB printers as driverless IPP
          - simple-scan
          - libnotify-bin  # notify-send: the volume popup of ~/.local/bin/vol (volume keys)
          - pasystray      # tray volume icon that follows the default output (~/.config/autostart/pasystray.desktop)
          - mpv            # video player; YouTube via yt-dlp from mise and VA-API (~/.config/mpv/mpv.conf)
          - libfuse2t64    # runs AppImages: conky (mise, ~/.config/conky) and Obsidian
    # Debian testing's cups 2.4.20-3 breaks driverless network printing ("Bad device URI", Debian bug #1153943, #62),
    # so forky machines keep trixie's 2.4.10 from a trixie source that nothing else installs from (priority 1).
    # Its security updates (2.4.10-3+deb13uN) come only with a playbook run: unattended-upgrades takes forky-security.
    # Once a fixed cups reaches testing: set cups_pin to false for one run (removes the pin, apt upgrades cups), then
    # delete this block.
    - name: Cups from trixie while testing's is broken (#62)
      when: ansible_facts['distribution_release'] == 'forky'
      vars:
        cups_pin: true
        cups_pkgs: [cups, cups-client, cups-common, cups-core-drivers, cups-daemon, cups-ipp-utils, cups-ppdc,
                    cups-server-common, libcups2t64]
      block:
        - name: Trixie source, used by the cups pin only
          ansible.builtin.copy:
            dest: /etc/apt/sources.list.d/trixie-cups.sources
            mode: "0644"
            content: |
              # Managed by ansible (dotfiles desktop role): trixie's cups while testing's is broken (#62).
              Types: deb
              URIs: http://deb.debian.org/debian
              Suites: trixie
              Components: main
              Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

              Types: deb
              URIs: http://security.debian.org/debian-security
              Suites: trixie-security
              Components: main
              Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          when: cups_pin
        - name: Cups pinned to trixie's 2.4.10, nothing else from trixie
          ansible.builtin.copy:
            dest: /etc/apt/preferences.d/cups-trixie
            mode: "0644"
            content: |
              # Managed by ansible (dotfiles desktop role): trixie's cups while testing's is broken (#62).
              Package: *
              Pin: release n=trixie
              Pin-Priority: 1

              Package: *
              Pin: release n=trixie-security
              Pin-Priority: 1

              Package: {{ (cups_pkgs + ['libcupsimage2t64', 'cups-bsd']) | join(' ') }}
              Pin: version 2.4.10-*
              Pin-Priority: 1001
          when: cups_pin
        - name: No cups pin
          ansible.builtin.file: { path: "{{ item }}", state: absent }
          loop: [/etc/apt/sources.list.d/trixie-cups.sources, /etc/apt/preferences.d/cups-trixie]
          when: not cups_pin
        # latest on purpose: apt's candidate is the pin's version, down while pinned and back up once unpinned.
        # libcupsimage2t64 and cups-bsd (not installed) are pinned too: installing them later keeps libcups at 2.4.10.
        - name: Cups at the pinned (or, unpinned, the newest) version  # noqa: package-latest
          ansible.builtin.apt:
            name: "{{ cups_pkgs }}"
            state: latest
            allow_downgrade: true
            update_cache: true
    # yt-dlp comes from mise (YouTube breaks old versions within weeks; Debian stable's is months old). mpv only
    # Recommends Debian's, so remove it and pin it out so a later mpv install does not bring it back.
    - name: No Debian yt-dlp (mise provides it)
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/no-debian-yt-dlp
        mode: "0644"
        content: |
          # Managed by ansible (dotfiles desktop role): yt-dlp comes from mise.
          Package: yt-dlp
          Pin: release *
          Pin-Priority: -1
    - name: Debian yt-dlp removed
      ansible.builtin.apt: { name: yt-dlp, state: absent }
    # Conky comes from mise (upstream's AppImage): Debian 13's 1.22 draws badly on Wayland ("LXQt (labwc)").
    - name: Debian conky removed (mise provides it)
      ansible.builtin.apt: { name: [conky-std, conky-all, conky], state: absent }

    # Both servers listen on the same PulseAudio socket; when the upgrade to Debian 14 brought PipeWire, PulseAudio
    # stayed installed and enabled, and whichever socket started first served (pulseaudio once took it back).
    # Enabled first, so masking PulseAudio never leaves a machine without a server (pipewire-pulse installed but off).
    - name: PipeWire serves where installed (all users)
      ansible.builtin.systemd_service: { name: "{{ item }}", scope: global, enabled: true }
      loop: [pipewire.socket, pipewire-pulse.socket, wireplumber.service]
      when: pipewire_pulse.stat.exists

    - name: PulseAudio off where PipeWire serves (all users)
      ansible.builtin.systemd_service: { name: "{{ item }}", scope: global, masked: true }
      loop: [pulseaudio.service, pulseaudio.socket]
      when: pipewire_pulse.stat.exists

    - name: Manage printers and scanners without sudo
      ansible.builtin.user: { name: "{{ user }}", groups: [lpadmin, scanner, bluetooth], append: true }
    - name: Bluetooth on
      ansible.builtin.systemd_service: { name: bluetooth, enabled: true, state: started }

    # Fixed Brave defaults (check brave://policy). Personal data (bookmarks, extensions, settings) goes through
    # Brave Sync; the profile dir is never versioned (cookies, passwords, binary databases).
    - name: Brave managed policies
      when: "'brave' in desktop"
      block:
        - name: Brave policy dir
          ansible.builtin.file: { path: /etc/brave/policies/managed, state: directory, mode: "0755" }
        - name: Brave policies
          ansible.builtin.copy:
            dest: /etc/brave/policies/managed/dotfiles.json
            mode: "0644"
            content: "{{ brave_policies | to_nice_json }}\n"
          vars:
            brave_policies:
              BraveRewardsDisabled: true
              BraveWalletDisabled: true
              BraveVPNDisabled: true
              BraveNewsDisabled: true
              BraveAIChatEnabled: false
              PasswordManagerEnabled: false   # Bitwarden instead
              # Memory Saver: unload background tabs (0 moderate, 1 balanced, 2 maximum); they reload on click
              HighEfficiencyModeEnabled: true
              MemorySaverModeSavings: 1
              BackgroundModeEnabled: false    # fully exit when the last window closes
              ExtensionInstallForcelist:
                - nngceckbapebfimnlniiiahkandclblb;https://clients2.google.com/service/update2/crx   # Bitwarden
                # No Dark Reader: it restyles from a script in every tab on each DOM change, a steady CPU cost on
                # busy pages. Pages are darkened by Blink's WebContentsForceDark instead (launcher flags below).
                # enhanced-h264ify: YouTube serves H.264 (up to 1080p), which older Intel GPUs decode in hardware
                # (VA-API, see "Hardware video decoding in Brave" below); VP9/AV1 would be decoded on the CPU
                - omkfmpieigblcllmkgbflkikinpkodlk;https://clients2.google.com/service/update2/crx   # enhanced-h264ify

    # Hardware video decoding in Brave on Intel graphics (found on the 2015 MacBook Pro, Broadwell / Iris 6100, then
    # X11, Brave 157; README "YouTube (Brave)" has the whole story). Two parts, both needed:
    #   1. enhanced-h264ify (policy above): YouTube sends H.264, which Broadwell decodes in hardware (no VP9/AV1).
    #   2. intel-media-va-driver-non-free: Chromium's VA-API decoder needs the driver's video post-processing
    #      (VAEntrypointVideoProc), which Debian's free build leaves out -> every video fell back to CPU decoding
    #      (renderer ~120% of a core) while brave://gpu still said "Hardware accelerated".
    # On X11 a third part was Vulkan compositing (Chromium's GL conversion corrupted frames there, and zero-copy needs
    # EGL, blocked for Intel on X11). The Wayland session has EGL: VaapiVideoDecoder, no Vulkan (#66).
    # Check: media-check (--decode).
    - name: Intel graphics?
      ansible.builtin.shell: grep -qx 0x8086 /sys/class/drm/card*/device/vendor 2>/dev/null && echo yes || true
      register: intel_gpu
      changed_when: false
    - name: Intel video decoding with post-processing
      ansible.builtin.apt: { name: [intel-media-va-driver-non-free] }
      when: "'yes' in intel_gpu.stdout"

    # Brave's flags: native dark pages everywhere (instead of Dark Reader, see the policy), no pinch zoom. Debian's
    # Brave reads no flags file, so a ~/.local/bin/brave-browser wrapper (ahead of /usr/bin in PATH: $BROWSER,
    # terminals) carries them, and a user copy of Brave's menu entry, regenerated from the packaged one each run (menu,
    # panel, links via mimeapps), starts the wrapper. Chromium honours only the last --enable-features: one list.
    - name: Brave launchers with its flags
      when: "'brave' in desktop"
      become: false
      vars:
        brave_features: WebContentsForceDark
      block:
        - name: Read Brave's packaged menu entry
          ansible.builtin.slurp: { src: /usr/share/applications/brave-browser.desktop }
          register: brave_desktop
        - name: User menu entry that starts the wrapper
          ansible.builtin.copy:
            dest: "{{ home }}/.local/share/applications/brave-browser.desktop"
            mode: "0644"
            content: >-
              {{ brave_desktop.content | b64decode
                 | regex_replace('(?m)^Exec=[^ \n]*brave-browser[^ \n]*', 'Exec=' ~ home ~ '/.local/bin/brave-browser') }}
        - name: Brave-browser wrapper with the flags
          ansible.builtin.copy:
            dest: "{{ home }}/.local/bin/brave-browser"
            mode: "0755"
            content: |
              #!/usr/bin/env bash
              # Generated by the dotfiles desktop role (ansible/roles/desktop): Brave with its flags.
              # --disable-pinch: no touchpad pinch zoom, it fired during two-finger scrolling (zoom: Ctrl+plus/minus/0).
              exec /usr/bin/brave-browser-stable --enable-features={{ brave_features }} --disable-pinch "$@"

    # Laptops/desktops without a modem or boot-time network dependencies. cups-browsed would add every printer on
    # every network as a queue; `printers` / `printer-add` add only the ones you pick.
    - name: Find unused system services
      ansible.builtin.service_facts:
    - name: Unused system services off
      ansible.builtin.systemd_service: { name: "{{ item }}", enabled: false, state: stopped }
      loop: [ModemManager.service, cups-browsed.service, NetworkManager-wait-online.service]
      when: item in ansible_facts.services

    # Not packaged in Debian/Ubuntu. Gestures: ~/.config/libinput-gestures.conf; started from
    # ~/.config/autostart/libinput-gestures.desktop (both chezmoi). Bump the tag to upgrade.
    - name: Libinput-gestures (from source)
      when: "'libinput-gestures' in desktop"
      block:
        - name: Clone libinput-gestures
          ansible.builtin.git:
            repo: https://github.com/bulletmark/libinput-gestures.git
            dest: /usr/local/src/libinput-gestures
            version: "2.81"
            force: true
          register: gestures_src
        - name: Install libinput-gestures
          ansible.builtin.command: make install
          args: { chdir: /usr/local/src/libinput-gestures }
          changed_when: true
          when: gestures_src.changed or not ('/usr/bin/libinput-gestures' is file)
        - name: User in input group
          ansible.builtin.user: { name: "{{ user }}", groups: input, append: true }

    - name: DBeaver CE
      ansible.builtin.apt: { deb: "https://dbeaver.io/files/dbeaver-ce_latest_amd64.deb" }
      when: "'dbeaver' in desktop and arch_deb == 'amd64'"

    - name: BalenaEtcher
      when: "'balena-etcher' in desktop and arch_deb == 'amd64'"
      block:
        - name: Latest balenaEtcher release
          ansible.builtin.uri:
            url: https://api.github.com/repos/balena-io/etcher/releases/latest
            headers: "{{ github_api_headers }}"
            return_content: true
          register: etcher_rel
          become: false
        - name: Install balenaEtcher .deb
          ansible.builtin.apt:
            deb: "{{ etcher_rel.json.assets | selectattr('name', 'search', 'amd64\\.deb$') | map(attribute='browser_download_url') | first }}"

    - name: Obsidian AppImage
      when: "'obsidian' in desktop"
      become: false
      block:
        - name: Latest Obsidian release
          ansible.builtin.uri:
            url: https://api.github.com/repos/obsidianmd/obsidian-releases/releases/latest
            headers: "{{ github_api_headers }}"
            return_content: true
          register: obsidian_rel
        # No mode: chezmoi also manages ~/.local/share/applications (umask 0775); forcing 0755 here made the two
        # flip it back and forth and chezmoi ask "has changed since chezmoi last wrote it".
        - name: Applications dirs  # noqa: risky-file-permissions  mode left to chezmoi, see comment above
          ansible.builtin.file: { path: "{{ item }}", state: directory }
          loop: ["{{ home }}/Applications", "{{ home }}/.local/share/applications"]
        - name: Download AppImage
          ansible.builtin.get_url:
            url: "{{ obsidian_rel.json.assets | selectattr('name', 'match', '^Obsidian-[0-9.]+\\.AppImage$') | map(attribute='browser_download_url') | first }}"
            dest: "{{ home }}/Applications/Obsidian.AppImage"
            mode: "0755"
        - name: Link into ~/.local/bin
          ansible.builtin.file:
            src: "{{ home }}/Applications/Obsidian.AppImage"
            dest: "{{ home }}/.local/bin/obsidian"
            state: link
            force: true
        - name: Menu entry (Papirus ships the obsidian icon)
          ansible.builtin.copy:
            dest: "{{ home }}/.local/share/applications/obsidian.desktop"
            mode: "0644"
            content: |
              [Desktop Entry]
              Type=Application
              Name=Obsidian
              Comment=Knowledge base
              Exec={{ home }}/Applications/Obsidian.AppImage %U
              Icon=obsidian
              Terminal=false
              Categories=Office;
              MimeType=x-scheme-handler/obsidian;

- name: Desktop apps (macOS)
  when: is_mac
  community.general.homebrew_cask:
    name: "{{ query('ansible.builtin.dict', cask_map) | selectattr('key', 'in', desktop) | map(attribute='value') | list }}"
  vars:
    cask_map:
      brave: brave-browser
      vscode: visual-studio-code
      kitty: kitty
      libreoffice: libreoffice
      balena-etcher: balenaetcher
      calibre: calibre
      obsidian: obsidian
      dbeaver: dbeaver-community
