---
- name: Debian/Ubuntu base
  when: is_debian
  block:
    - name: Keyring dir
      ansible.builtin.file: { path: "{{ keyrings }}", state: directory, mode: "0755" }

    - name: GitHub CLI repo
      ansible.builtin.deb822_repository:
        name: github-cli
        types: deb
        uris: https://cli.github.com/packages
        suites: stable
        components: main
        architectures: "{{ arch_deb }}"
        signed_by: https://cli.github.com/packages/githubcli-archive-keyring.gpg
      # key servers time out now and then, and the module re-fetches the key on every run
      register: repo_key
      until: repo_key is succeeded
      retries: 3
      delay: 10

    - name: Fish PPA (Ubuntu only; Debian uses the distro package)
      ansible.builtin.apt_repository:
        repo: ppa:fish-shell/release-4
        codename: "{{ ansible_distribution_release }}"
      when: ansible_distribution == 'Ubuntu'

    - name: Tshark installs without asking about non-root capture (no)
      ansible.builtin.debconf:
        name: wireshark-common
        question: wireshark-common/install-setuid
        value: "false"
        vtype: boolean

    - name: Core packages
      ansible.builtin.apt:
        update_cache: true
        name:
          - git
          - gh
          - fish
          - tmux
          - vim
          - ripgrep
          - fd-find
          - jq
          - tree
          - curl
          - wget
          - unzip
          - build-essential
          - cmake
          - p7zip-full
          - zstd
          - shellcheck
          - python3-venv    # Mason's pip packages (pyrefly, ansible-lint, sqlfluff) build a venv
          - fontconfig
          # system info / monitoring (needs root or kernel interfaces; CLI ones like btop come from mise)
          - inxi            # hardware report: inxi -Fxz
          - lm-sensors      # sensors: temps, fans
          - smartmontools   # sudo smartctl -a /dev/sda: disk health
          - iotop-c         # per-process disk IO
          - nethogs         # per-process network
          - nvtop           # GPU monitor
          - s-tui           # CPU frequency/temperature + stress
          - acpi            # acpi -b: battery
          - speedtest-cli   # speedtest
          # network (more in mise: doggo, xh, gping, grpcurl, websocat; fish: myip, ports)
          - bind9-dnsutils  # dig, nslookup, host
          - whois
          - mtr-tiny        # live traceroute + ping
          - traceroute
          - iputils-arping
          - nmap            # + ncat
          - arp-scan        # sudo arp-scan -l: who's on this LAN
          - netcat-openbsd
          - socat
          - testssl.sh      # TLS config check
          - sslscan
          - swaks           # SMTP test
          - tcpdump         # capture needs sudo (no setuid wireshark group)
          - tshark
          - ngrep
          - iperf3          # throughput between two hosts
          - iftop           # per-connection bandwidth
          - nload           # per-interface bandwidth
          - wavemon         # Wi-Fi signal/channel
          - ipcalc

# Memory: compressed swap in RAM (zram, ~3x on typical pages) used before the disk swap, and earlyoom so a runaway
# browser tab gets killed instead of the whole machine freezing. Disk swap (hibernation) stays as the fallback.
- name: Memory (zram + earlyoom)
  when: is_debian
  block:
    - name: Zram and earlyoom packages
      ansible.builtin.apt: { name: [systemd-zram-generator, earlyoom] }

    - name: Zram swap device
      ansible.builtin.copy:
        dest: /etc/systemd/zram-generator.conf
        mode: "0644"
        content: |
          [zram0]
          zram-size = min(ram / 2, 4096)
          compression-algorithm = zstd
          swap-priority = 100
      register: zram_conf

    - name: Start zram swap  # noqa: no-handler  restart only when the config changed, inline on purpose
      ansible.builtin.systemd_service: { name: systemd-zram-setup@zram0, state: restarted, daemon_reload: true }
      when: zram_conf.changed

    # zram makes swapping cheap: swap cold pages early, one page at a time (no readahead)
    - name: VM tuning for zram
      ansible.builtin.copy:
        dest: /etc/sysctl.d/90-zram.conf
        mode: "0644"
        content: |
          vm.swappiness = 180
          vm.page-cluster = 0
      register: zram_sysctl

    - name: Apply sysctl  # noqa: no-handler  inline on purpose
      ansible.builtin.command: sysctl --system
      when: zram_sysctl.changed
      changed_when: true

    # Debian defaults: act below 10% free RAM and 10% free swap. Chromium/Electron renderers already have a high
    # oom_score_adj, so a heavy tab goes first; never the display server or the session.
    - name: Earlyoom options
      ansible.builtin.copy:
        dest: /etc/default/earlyoom
        mode: "0644"
        content: |
          EARLYOOM_ARGS="-r 0 --avoid (^|/)(Xorg|sddm|sddm-helper|lxqt-session|xfwm4|systemd|sshd)$"
      register: earlyoom_conf

    - name: Earlyoom running
      ansible.builtin.systemd_service:
        name: earlyoom
        enabled: true
        state: "{{ 'restarted' if earlyoom_conf.changed else 'started' }}"

# Security updates (kernel included) install themselves daily; the reboot is left to the user. The hcloud server does
# the opposite (reboots itself at 04:00) because nothing ever reboots a server; a laptop or desktop reboots often, and
# rebooting one under its user loses work. reboot-needed (~/.local/bin; fish at shell start, Conky on the desktop) says
# when a new kernel or library waits for one. Origins stay Debian's default: security only. Point releases, Brave,
# Docker and the other third-party repos still come with a manual apt upgrade. Release upgrades: debian-release-upgrade.
- name: Automatic security updates
  when: is_debian
  block:
    - name: Unattended-upgrades
      ansible.builtin.apt: { name: [unattended-upgrades, apt-listchanges] }

    - name: Run apt update and unattended-upgrade daily (apt-daily timers)
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    - name: Never reboot by itself; only on AC power; drop superseded kernels
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/51unattended-upgrades-local
        mode: "0644"
        content: |
          // Managed by the dotfiles (ansible base role). See the comment there.
          Unattended-Upgrade::Automatic-Reboot "false";
          Unattended-Upgrade::OnlyOnACPower "true";
          Unattended-Upgrade::Skip-Updates-On-Metered-Connections "true";
          Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
          Unattended-Upgrade::Remove-New-Unused-Dependencies "true";

- name: MacOS base
  when: is_mac
  community.general.homebrew:
    name:
      [git, gh, fish, tmux, vim, ripgrep, fd, jq, tree, smartmontools, nmap, mtr, swaks, iperf3, whois, testssl, sslscan, ipcalc, wget,
       p7zip, zstd, shellcheck, mise]

- name: Register fish as a login shell
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: "{{ '/opt/homebrew/bin/fish' if is_mac else '/usr/bin/fish' }}"
  become: true

- name: Default shell is fish
  ansible.builtin.user:
    name: "{{ user }}"
    shell: "{{ '/opt/homebrew/bin/fish' if is_mac else '/usr/bin/fish' }}"
  become: true
  when: is_debian
