---
- name: PGDG repo
  ansible.builtin.deb822_repository:
    name: pgdg
    types: deb
    uris: https://apt.postgresql.org/pub/repos/apt
    suites: "{{ ansible_facts['distribution_release'] }}-pgdg"
    components: main
    signed_by: https://apt.postgresql.org/pub/repos/apt/ACCC4CF8.asc   # same key as www.postgresql.org/media/keys, faster
  # key servers time out now and then, and the module re-fetches the key on every run
  register: repo_key
  until: repo_key is succeeded
  retries: 3
  delay: 10
  when: is_debian

- name: Postgres packages
  ansible.builtin.apt: { name: [postgresql, postgresql-client, pg-activity], update_cache: true }
  when: is_debian

# Not at boot (~100 MB, 9 processes): `pgstart` / `pgstop` (fish) when needed.
- name: Postgres not started at boot
  ansible.builtin.systemd_service: { name: postgresql, enabled: false }
  when: is_debian

- name: Postgres (macOS)
  community.general.homebrew: { name: [postgresql@17, pg_activity] }
  when: is_mac
