---
- name: PGDG repo
  ansible.builtin.deb822_repository:
    name: pgdg
    types: deb
    uris: https://apt.postgresql.org/pub/repos/apt
    suites: "{{ ansible_distribution_release }}-pgdg"
    components: main
    signed_by: https://www.postgresql.org/media/keys/ACCC4CF8.asc
  when: is_debian

- name: Postgres packages
  ansible.builtin.apt: { name: [postgresql, postgresql-client, pg-activity], update_cache: true }
  when: is_debian

- name: Postgres (macOS)
  community.general.homebrew: { name: [postgresql@17, pg_activity] }
  when: is_mac
