---
# genmedia's Flow backend (gflow-cli) launches Playwright with channel="chrome", which accepts only
# /opt/google/chrome/chrome. Brave stands in there through a symlink, so the browser that saved the Flow login
# cookies is the same one that reads them back. This role runs on every Debian machine so turning the `genmedia`
# extra off removes the symlink again. It only ever removes its own symlink to Brave, never a real Chrome install.
- name: Brave stands in for Chrome at Playwright's path
  vars:
    genmedia_chrome: /opt/google/chrome/chrome
    genmedia_brave: /opt/brave.com/brave/brave-browser
  block:
    - name: Look at the Chrome path
      ansible.builtin.stat: { path: "{{ genmedia_chrome }}" }
      register: genmedia_chrome_stat

    - name: Look for Brave
      ansible.builtin.stat: { path: "{{ genmedia_brave }}" }
      register: genmedia_brave_stat

    - name: Link Brave into the Chrome path
      when:
        - "'genmedia' in extras"
        - genmedia_brave_stat.stat.exists
        - not genmedia_chrome_stat.stat.exists or genmedia_chrome_stat.stat.islnk
      block:
        - name: Chrome directory
          ansible.builtin.file: { path: /opt/google/chrome, state: directory, mode: "0755" }
        - name: Chrome symlink to Brave
          ansible.builtin.file: { src: "{{ genmedia_brave }}", dest: "{{ genmedia_chrome }}", state: link, force: true }

    - name: Say why there is no link
      ansible.builtin.debug:
        msg: >-
          genmedia: {{ 'Brave is not installed (select brave in desktop, or install Google Chrome)'
          if not genmedia_brave_stat.stat.exists else 'a real Google Chrome is installed; using it' }}
      when:
        - "'genmedia' in extras"
        - not genmedia_brave_stat.stat.exists or (genmedia_chrome_stat.stat.exists and not genmedia_chrome_stat.stat.islnk)

    - name: Remove the Brave link when genmedia is off
      when:
        - "'genmedia' not in extras"
        - genmedia_chrome_stat.stat.islnk | default(false)
        - genmedia_chrome_stat.stat.lnk_target == genmedia_brave
      block:
        - name: Chrome symlink
          ansible.builtin.file: { path: "{{ genmedia_chrome }}", state: absent }
        - name: Chrome directories, if now empty  # noqa: no-changed-when  rmdir only removes empty dirs
          ansible.builtin.command: rmdir --ignore-fail-on-non-empty /opt/google/chrome /opt/google
