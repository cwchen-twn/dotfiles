# HiDPI (the `hidpi` var from setup.yml): the compositor scales the session (kanshi); only the panel's sizes follow it.
lxqt_hidpi: "{{ hidpi | default(false) }}"
# Desktop icons pcmanfm-qt generates for its DesktopShortcuts setting (Home, Trash, Computer, Network); removed, with
# the setting emptied: the file manager's side pane has them all.
lxqt_desktop_shortcut_files: "{{ ['user-home', 'trash-can', 'computer', 'network']
  | map('regex_replace', '^(.*)$', home ~ '/Desktop/\\1.desktop') | list }}"
# Desktop wallpaper: the boottheme role's wallpaper image (boottheme_images.wallpaper, cropped to the screen), else the
# login preset's own image; zoomed to fill.
lxqt_wallpaper: "{{ boottheme_bg.wallpaper
  | default('/usr/share/sddm/themes/sddm-astronaut-theme/Backgrounds/' ~ (boottheme_preset | default('black_hole')) ~ '.png') }}"

# System-wide dark mode: LXQt theme + palette, GTK 3/4, and the freedesktop color-scheme (Brave, VS Code, Electron).
lxqt_dark: true
lxqt_dark_palette: Kvantum   # /usr/share/lxqt/palettes/<name>

# Panel quick launch + main menu favorites, in order. `app` must be in the chezmoi desktop selection ('' = always);
# the first existing .desktop file of each entry is used (user overrides first), apps with none are skipped.
lxqt_favorites:
  - { app: "", files: [/usr/share/applications/pcmanfm-qt.desktop] }
  - { app: brave, files: ["{{ home }}/.local/share/applications/brave-browser.desktop", /usr/share/applications/brave-browser.desktop] }
  - { app: alacritty, files: [/usr/share/applications/Alacritty.desktop] }
  - { app: vscode, files: [/usr/share/applications/com.microsoft.VSCode.desktop, /usr/share/applications/code.desktop] }
  - { app: obsidian, files: ["{{ home }}/.local/share/applications/obsidian.desktop"] }
  - { app: dbeaver, files: [/usr/share/applications/dbeaver-ce.desktop] }
  - { app: supersonic, files: ["{{ home }}/.local/share/applications/supersonic.desktop"] }

# Panel widgets, left to right: Debian's default minus `mount` (removable media), `volume` (it controls one fixed
# device, so it showed the speakers while sound played on Bluetooth headphones: pasystray in the tray instead, desktop
# role) and the X11-only `kbindicator` and `tray` (Wayland tray icons are `statusnotifier`), plus `cpuload`.
lxqt_panel_plugins: [mainmenu, showdesktop, desktopswitch, quicklaunch, taskbar, statusnotifier, worldclock, cpuload,
                     quicklaunch2]
# Sections for widgets the distro default doesn't define.
lxqt_panel_plugin_sections:
  cpuload: { type: cpuload, alignment: Right }

# Types the LibreOffice .desktop files list that stay with other apps (editor, browser, PDF viewer).
lxqt_office_mime_exclude: [text/plain, text/html, application/xhtml+xml, application/pdf]

lxqt_browser_mimetypes:
  - text/html
  - application/xhtml+xml
  - x-scheme-handler/http
  - x-scheme-handler/https
  - x-scheme-handler/about
  - x-scheme-handler/unknown
