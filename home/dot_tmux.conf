set -g default-terminal "screen-256color"

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on

# Apps' copies reach the system clipboard (OSC 52): Claude Code's copy-on-select, nvim, and tmux's own `y`.
# "external" would drop what apps send, and tmux only knows xterm* terminals can take it.
set -s set-clipboard on
set -as terminal-features ',xterm-kitty:clipboard'

# vi-like key mapping
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after host restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15mins

set -g @themepack 'powerline/default/cyan'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Init TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
