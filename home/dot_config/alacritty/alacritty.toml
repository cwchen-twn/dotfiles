[font]
size = 12.0

[font.bold]
family = "JetBrainsMono Nerd Font"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"

[font.italic]
family = "JetBrainsMono Nerd Font"

[font.normal]
family = "JetBrainsMono Nerd Font"

[window]
opacity = 0.8
dimensions.columns = 100
dimensions.lines = 30

# Shift+Enter sends ESC+CR (Meta+Enter), which Claude Code reads as a newline instead of submit.
[keyboard]
bindings = [{ key = "Return", mods = "Shift", chars = "\u001B\r" }]
