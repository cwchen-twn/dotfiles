# Managed by chezmoi. kitty takes files dropped on it under Wayland (pastes the path), which Alacritty can't (#102).

font_family JetBrainsMono Nerd Font
font_size 12.0

background_opacity 0.8

remember_window_size no
initial_window_width 100c
initial_window_height 30c

# Shift+Enter sends ESC+CR (Meta+Enter), which Claude Code reads as a newline instead of submit.
map shift+enter send_text all \x1b\r
