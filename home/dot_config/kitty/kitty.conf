# Managed by chezmoi. kitty takes files dropped on it under Wayland (pastes the path), which Alacritty can't (#102).

font_family JetBrainsMono Nerd Font
font_size 12.0

background_opacity 0.8

# Alacritty's default colors: kitty's own background is pure black, which looks darker and less see-through at the
# same opacity.
foreground #d8d8d8
background #181818
color0  #181818
color1  #ac4242
color2  #90a959
color3  #f4bf75
color4  #6a9fb5
color5  #aa759f
color6  #75b5aa
color7  #d8d8d8
color8  #6b6b6b
color9  #c55555
color10 #aac474
color11 #feca88
color12 #82b8c8
color13 #c28cb8
color14 #93d3c3
color15 #f8f8f8

remember_window_size no
initial_window_width 100c
initial_window_height 30c

# Shift+Enter sends ESC+CR (Meta+Enter), which Claude Code reads as a newline instead of submit.
map shift+enter send_text all \x1b\r
