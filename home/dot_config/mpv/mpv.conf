# Managed by chezmoi. mpv: the light way to watch YouTube on old hardware (yt <url>): the GPU decodes H.264 via
# VA-API, where Brave on this Broadwell GPU falls back to the CPU (brave-decode-test).
hwdec=vaapi
# H.264 up to 1080p: the codec older Intel GPUs decode in hardware (no VP9/AV1 on Broadwell). Needs yt-dlp (mise).
ytdl-format=bestvideo[vcodec^=avc1][height<=1080]+bestaudio/best[vcodec^=avc1][height<=1080]/best[height<=1080]
keep-open=yes
save-position-on-quit=yes
