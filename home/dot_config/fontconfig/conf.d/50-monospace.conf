<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Default monospace: JetBrainsMono Nerd Font (installed by .chezmoiexternal), so terminals, editors and code
     blocks in browsers get Nerd Font icons. DejaVu stays as the fallback for missing glyphs. -->
<fontconfig>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>
</fontconfig>
