# Managed by chezmoi (MacBooks). PipeWire runs here only so browsers can use the FaceTime camera; audio stays on
# PulseAudio, so WirePlumber must not grab the sound card or Bluetooth.
wireplumber.profiles = {
  main = {
    monitor.alsa = disabled
    monitor.alsa-midi = disabled
    monitor.bluez = disabled
    monitor.bluez-midi = disabled
    monitor.libcamera = disabled
  }
}
