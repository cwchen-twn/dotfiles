# Managed by chezmoi. Bluetooth headphones under PipeWire (Debian 14): A2DP with SBC XQ or SBC only. WirePlumber
# would pick LDAC, which costs about half a core to encode on a 2015 dual-core; SBC XQ about half of that, and most
# ears can't tell on consumer headphones. The same choice bt-codec made under PulseAudio. Reload: systemctl --user
# restart wireplumber, then reconnect the headphones.
monitor.bluez.properties = {
  bluez5.codecs = [ sbc_xq sbc ]
}
