# The gate on every PR and on main: install the pinned tools (mise.toml), then `make audit`.
# CI runs nothing that isn't a make target.
#
# Runner facts (labels: catopia/hcloud#212):
#   * `linux` is the runner pool, off the VPS. It maps to node:22-bookworm: git, make and python3.
#   * Checkout uses the public name: the in-cluster Service does not exist from the pool.
#   * There is no cache server, so mise downloads the tools on every run.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: linux
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - name: Install the pinned tools
        uses: jdx/mise-action@v5.2.10
        with:
          version: 2026.11.8 # mise itself, as on the machines
          cache: false
          # the default is the Gitea job token, which api.github.com rejects (401); mise downloads anonymously
          github_token: ""

      - name: make audit
        run: make audit
