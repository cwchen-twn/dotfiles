# The gate on every PR and on main: install the pinned tools (mise.toml), then `make audit`.
# CI runs nothing that isn't a make target.
#
# Runner facts (shared with hcloud and rigel-ledger):
#   * ubuntu-latest maps to node:22-bookworm on the act-runner: it has git, make and python3.
#   * Checkout goes through the in-cluster Service. The public name is behind Cloudflare, which has 403'd
#     job-container fetches before.
#   * There is no cache server, so mise downloads the tools on every run.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          github-server-url: http://gitea-http.gitea.svc.cluster.local:3000
          fetch-depth: 0 # gitleaks scans the whole history

      - name: Install the pinned tools
        uses: jdx/mise-action@v5.2.10
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: 2026.11.8 # mise itself, as on the machines
          cache: false
          # the default is the Gitea job token, which api.github.com rejects (401); mise downloads anonymously
          github_token: ""

      - name: make audit
        run: make audit
